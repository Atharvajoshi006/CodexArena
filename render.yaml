services:
  - type: web
    name: codexarena-backend
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn codexarena.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: codexarena.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL must be set manually in the Render dashboard
      # Use the Supabase "Transaction pooler" connection string (port 6543)
      # Format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
