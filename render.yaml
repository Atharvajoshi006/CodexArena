services:
  - type: web
    name: codexarena-backend
    env: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn codexarena.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: codexarena.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codexarena-db
          property: connectionString

databases:
  - name: codexarena-db
    databaseName: codexarena
    user: codexarena
